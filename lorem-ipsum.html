<body class="text-slate-200 min-h-screen font-sans antialiased">

<main class="max-w-3xl mx-auto px-4 py-10">
<div class="text-center mb-8">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-medium mb-4">📝 Placeholder Text</div>
<h1 class="text-3xl sm:text-4xl font-bold text-white mb-3">Lorem Ipsum Generator</h1>
<p class="text-slate-400 text-sm">Generate dummy text for designs, mockups and prototypes.</p>
</div>

<div class="glass rounded-2xl p-6 sm:p-8">
<div class="flex flex-wrap gap-4 mb-5">
<div>
<label class="block text-xs font-semibold text-slate-400 mb-1">Type</label>
<select id="type" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm">
<option value="paragraphs">Paragraphs</option>
<option value="sentences">Sentences</option>
<option value="words">Words</option>
</select>
</div>
<div>
<label class="block text-xs font-semibold text-slate-400 mb-1">Amount</label>
<input type="number" id="amount" value="3" min="1" max="50" class="w-20 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm">
</div>
<button onclick="generate()" class="self-end bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-6 py-2 rounded-xl transition">Generate</button>
</div>

<textarea id="output" rows="10" readonly class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-300 text-sm leading-relaxed"></textarea>

<div class="flex gap-3 mt-3">
<button onclick="copyText()" class="px-5 py-2.5 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition text-sm font-medium">Copy Text</button>
</div>
<p id="status" class="text-xs text-slate-500 mt-2"></p>
</div>
</main>

<footer class="border-t border-slate-800 mt-12 py-8 text-center text-slate-500 text-sm">© 2026 AI Micro-Tools Hub</footer>

<script>
const words = ["lorem","ipsum","dolor","sit","amet","consectetur","adipiscing","elit","sed","do","eiusmod","tempor","incididunt","ut","labore","et","dolore","magna","aliqua","enim","ad","minim","veniam","quis","nostrud","exercitation","ullamco","laboris","nisi","aliquip","ex","ea","commodo","consequat","duis","aute","irure","in","reprehenderit","voluptate","velit","esse","cillum","fugiat","nulla","pariatur","excepteur","sint","occaecat","cupidatat","non","proident","sunt","culpa","qui","officia","deserunt","mollit","anim","id","est","laborum"];
function randomWord(){ return words[Math.floor(Math.random()*words.length)]; }
function sentence(){
  let len = 8 + Math.floor(Math.random()*10);
  let s = randomWord().charAt(0).toUpperCase() + randomWord().slice(1);
  for(let i=1;i<len;i++) s += " " + randomWord();
  return s + ".";
}
function paragraph(){
  let n = 3 + Math.floor(Math.random()*4);
  let p = [];
  for(let i=0;i<n;i++) p.push(sentence());
  return p.join(" ");
}
function generate(){
  const type = document.getElementById('type').value;
  const amount = Math.min(50, Math.max(1, +document.getElementById('amount').value || 1));
  let result = [];
  if(type === 'paragraphs') for(let i=0;i<amount;i++) result.push(paragraph());
  else if(type === 'sentences') for(let i=0;i<amount;i++) result.push(sentence());
  else for(let i=0;i<amount;i++) result.push(randomWord());
  document.getElementById('output').value = type === 'words' ? result.join(" ") : result.join("\n\n");
  document.getElementById('status').textContent = '✓ Generated ' + amount + ' ' + type;
}
function copyText(){
  const t = document.getElementById('output').value;
  if(!t) return;
  navigator.clipboard.writeText(t).then(()=> document.getElementById('status').textContent = '✓ Copied!');
}
generate();
</script>
</body>
