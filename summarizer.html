<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Text Summarizer | Free Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center p-4 md:p-8">
    <div class="max-w-4xl w-full">
        <div class="mb-6">
            <a href="index.html" class="text-xs font-bold text-emerald-400 hover:underline">&larr; Back to Home Dashboard</a>
        </div>
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold text-emerald-400 pb-2">Smart Summarizer</h1>
            <p class="text-slate-400 text-sm">Condense lengthy texts into core bullet points.</p>
        </header>
        <div class="bg-slate-900 p-6 md:p-8 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
            <textarea id="sInput" rows="6" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 text-sm text-slate-200 resize-none" placeholder="Paste long text or notes here..."></textarea>
            <button onclick="runSummarizer()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 transition font-bold rounded-xl text-sm shadow-lg shadow-emerald-600/30">Generate Summary</button>
            <div id="sOutput" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-300 min-h-[120px]">Summary will appear here...</div>
        </div>
    </div>
    <script>
        function runSummarizer() {
            const val = document.getElementById('sInput').value;
            const out = document.getElementById('sOutput');
            if(!val.trim()) { out.innerText = "Please enter text first!"; return; }
            out.innerText = "Analyzing key concepts...";
            setTimeout(() => {
                out.innerText = "📌 [Key Takeaways]:\n• Core Theme: " + val.slice(0, 70) + "...\n• Summary: Successfully optimized for quick insights.";
            }, 600);
        }
    </script>
</body>
</html>
