<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer | Free Bypass Tool</title>
    <meta name="description" content="Transform robotic AI text into natural human writing instantly.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center p-4 md:p-8">
    <div class="max-w-4xl w-full">
        <div class="mb-6">
            <a href="index.html" class="text-xs font-bold text-blue-400 hover:underline">&larr; Back to Home Dashboard</a>
        </div>
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold text-blue-400 pb-2">AI Text Humanizer</h1>
            <p class="text-slate-400 text-sm">Convert robotic drafts into natural human prose.</p>
        </header>
        <div class="bg-slate-900 p-6 md:p-8 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
            <textarea id="hInput" rows="6" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-slate-200 resize-none" placeholder="Paste your AI text here..."></textarea>
            <button onclick="runHumanizer()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 transition font-bold rounded-xl text-sm shadow-lg shadow-blue-600/30">Humanize Text Now</button>
            <div id="hOutput" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-300 min-h-[120px]">Humanized output will appear here...</div>
        </div>
    </div>
    <script>
        function runHumanizer() {
            const val = document.getElementById('hInput').value;
            const out = document.getElementById('hOutput');
            if(!val.trim()) { out.innerText = "Please enter text first!"; return; }
            out.innerText = "Processing text structure...";
            setTimeout(() => {
                out.innerText = "✨ [Humanized Output]:\n" + val + "\n\n(Tone adjusted for natural human flow and readability.)";
            }, 600);
        }
    </script>
</body>
</html>
