<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator | Create Custom QR Codes Online</title>
    <meta name="description" content="Generate high-resolution QR codes instantly for URLs, text, and Wi-Fi. 100% free online QR code generator tool.">
    <meta name="keywords" content="free qr code generator, create qr code online, url to qr code, custom qr maker, micro tools hub">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center p-4 md:p-8">
    <div class="max-w-4xl w-full">
        <div class="mb-6">
            <a href="index.html" class="text-xs font-bold text-emerald-400 hover:underline">&larr; Back to Home Dashboard</a>
        </div>
        
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold text-emerald-400 pb-2">Free QR Code Generator</h1>
            <p class="text-slate-400 text-sm">Convert any link, text, or data into a scannable QR code instantly.</p>
        </header>

        <div class="bg-slate-900 p-6 md:p-8 rounded-2xl border border-slate-800 space-y-6 shadow-xl">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Enter Text or URL</label>
                <input type="text" id="qrInput" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 text-sm text-slate-200 placeholder-slate-600" placeholder="https://example.com or your text here...">
            </div>

            <button onclick="generateQR()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 transition font-bold rounded-xl text-sm shadow-lg shadow-emerald-600/30">Generate QR Code</button>

            <div class="flex flex-col items-center justify-center pt-4 border-t border-slate-800">
                <div id="qrcode" class="p-4 bg-white rounded-xl shadow-lg"></div>
                <p class="text-xs text-slate-500 mt-4">Scan using any smartphone camera to test.</p>
            </div>
        </div>
    </div>

    <script>
        function generateQR() {
            const val = document.getElementById('qrInput').value;
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            
            if(!val || !val.trim()) { 
                alert("Please enter a valid text or URL!"); 
                return; 
            }
            
            new QRCode(qrContainer, {
                text: val,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // Generate default QR on load
        window.onload = function() {
            document.getElementById('qrInput').value = "https://ai-tool-hub-crn7-git-main-al-aaliyy.vercel.app/";
            generateQR();
        }
    </script>
</body>
</html>
