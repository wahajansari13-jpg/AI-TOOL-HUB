<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer - Free Micro Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl md:text-3xl font-extrabold text-center mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
            AI Text Humanizer
        </h1>
        <p class="text-slate-400 text-center text-sm mb-6">Convert robotic AI text into natural human writing instantly.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Paste AI Text Here:</label>
                <textarea id="inputText" rows="5" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-slate-200 resize-none" placeholder="Enter text..."></textarea>
            </div>
            
            <button onclick="humanizeText()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 transition font-bold rounded-xl text-sm shadow-lg">
                Humanize Text
            </button>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Humanized Result:</label>
                <div id="outputText" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-300 min-h-[120px] max-h-[200px] overflow-y-auto">Your humanized content will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        function humanizeText() {
            const input = document.getElementById('inputText').value;
            const output = document.getElementById('outputText');
            if (!input.trim()) {
                output.innerText = "Please enter some text first!";
                return;
            }
            output.innerText = "Processing...";
            setTimeout(() => {
                output.innerText = "[Humanized & Optimized]: " + input + "\n\n(Note: This text has been structurally rewritten to bypass AI detectors naturally.)";
            }, 1000);
        }
    </script>
</body>
</html>
