<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>Free Password Generator Online | Strong Secure Passwords</title>
<meta name="description" content="Generate strong, secure, random passwords online for free. Customize length and character types. No signup required.">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b0f1a}
.glass{background:rgba(15,23,42,.75);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.12)}
</style>
</head>
<body class="text-slate-200 min-h-screen font-sans antialiased">
<nav class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
<a href="index.html" class="flex items-center gap-2 font-bold text-lg">
<span class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-sm font-bold">AI</span>
Micro-Tools Hub
</a>
<div class="hidden sm:flex gap-5 text-sm font-medium text-slate-400">
<a href="index.html" class="hover:text-white transition">Home</a>
<a href="case-converter.html" class="hover:text-white transition">Case Converter</a>
<a href="password-generator.html" class="text-blue-400">Password</a>
<a href="counter.html" class="hover:text-white transition">Counter</a>
<a href="qr-generator.html" class="hover:text-white transition">QR Code</a>
</div>
</div>
</nav>

<main class="max-w-2xl mx-auto px-4 py-10">
<div class="text-center mb-8">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium mb-4">🔒 Security Tool</div>
<h1 class="text-3xl sm:text-4xl font-bold text-white mb-3">Password Generator</h1>
<p class="text-slate-400 text-sm">Create strong, random, secure passwords instantly.</p>
</div>

<div class="glass rounded-2xl p-6 sm:p-8">
<div class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-4 text-center mb-5">
<p id="password" class="text-xl sm:text-2xl font-mono text-white break-all tracking-wider">Click Generate</p>
</div>

<div class="space-y-4">
<div>
<label class="block text-xs font-semibold text-slate-400 mb-1">Length: <span id="lenVal">16</span></label>
<input type="range" id="length" min="6" max="64" value="16" class="w-full accent-blue-500" oninput="document.getElementById('lenVal').textContent=this.value">
</div>

<div class="grid grid-cols-2 gap-3 text-sm">
<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="upper" checked class="rounded bg-slate-800 border-slate-600 text-blue-500"> Uppercase (A-Z)</label>
<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="lower" checked class="rounded bg-slate-800 border-slate-600 text-blue-500"> Lowercase (a-z)</label>
<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="numbers" checked class="rounded bg-slate-800 border-slate-600 text-blue-500"> Numbers (0-9)</label>
<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="symbols" checked class="rounded bg-slate-800 border-slate-600 text-blue-500"> Symbols (!@#$)</label>
</div>
</div>

<div class="flex gap-3 mt-6">
<button onclick="generate()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl transition">Generate Password</button>
<button onclick="copyPass()" class="px-5 py-3 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition text-sm font-medium">Copy</button>
</div>
<p id="status" class="text-xs text-slate-500 mt-3 text-center"></p>
</div>
</main>

<footer class="border-t border-slate-800 mt-12 py-8 text-center text-slate-500 text-sm">© 2026 AI Micro-Tools Hub</footer>

<script>
function generate(){
  const len = +document.getElementById('length').value;
  let chars = '';
  if(document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('numbers').checked) chars += '0123456789';
  if(document.getElementById('symbols').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars){ document.getElementById('status').textContent='Select at least one option'; return; }
  let pass = '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for(let i=0;i<len;i++) pass += chars[arr[i] % chars.length];
  document.getElementById('password').textContent = pass;
  document.getElementById('status').textContent = '✓ Strong password generated';
}
function copyPass(){
  const t = document.getElementById('password').textContent;
  if(t === 'Click Generate') return;
  navigator.clipboard.writeText(t).then(()=> document.getElementById('status').textContent = '✓ Copied to clipboard!');
}
generate();
</script>
</body>
</html>
