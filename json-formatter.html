<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>Free JSON Formatter & Validator Online</title>
<meta name="description" content="Format, validate and beautify JSON online for free. Minify or pretty-print JSON instantly. No signup required.">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b0f1a}
.glass{background:rgba(15,23,42,.75);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.12)}
textarea::-webkit-scrollbar{width:6px}
textarea::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
</style>
</head>
<body class="text-slate-200 min-h-screen font-sans antialiased">
<nav class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
<a href="index.html" class="flex items-center gap-2 font-bold text-lg">
<span class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-sm font-bold">AI</span>
Micro-Tools Hub
</a>
<div class="hidden sm:flex gap-5 text-sm font-medium text-slate-400">
<a href="index.html" class="hover:text-white transition">Home</a>
<a href="json-formatter.html" class="text-blue-400">JSON Formatter</a>
<a href="case-converter.html" class="hover:text-white transition">Case Converter</a>
<a href="counter.html" class="hover:text-white transition">Counter</a>
<a href="qr-generator.html" class="hover:text-white transition">QR Code</a>
</div>
</div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-10">
<div class="text-center mb-8">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium mb-4">{ } Developer Tool</div>
<h1 class="text-3xl sm:text-4xl font-bold text-white mb-3">JSON Formatter</h1>
<p class="text-slate-400 text-sm">Format, validate and minify JSON instantly.</p>
</div>

<div class="glass rounded-2xl p-6 sm:p-8">
<label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Paste JSON</label>
<textarea id="input" rows="8" placeholder='{"name": "example", "value": 123}' class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 resize-y text-sm font-mono"></textarea>

<div class="flex flex-wrap gap-2 mt-4">
<button onclick="format(true)" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition">Format / Beautify</button>
<button onclick="format(false)" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-sm font-medium transition">Minify</button>
<button onclick="validate()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-sm font-medium transition">Validate</button>
<button onclick="clearAll()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-red-600/80 border border-slate-600 text-sm font-medium transition">Clear</button>
</div>

<label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mt-6 mb-2">Result</label>
<textarea id="output" rows="8" readonly class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-300 text-sm font-mono resize-y"></textarea>

<div class="flex gap-3 mt-3">
<button onclick="copyResult()" class="px-5 py-2.5 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition text-sm font-medium">Copy Result</button>
</div>
<p id="status" class="text-xs mt-2"></p>
</div>
</main>

<footer class="border-t border-slate-800 mt-12 py-8 text-center text-slate-500 text-sm">© 2026 AI Micro-Tools Hub</footer>

<script>
function format(pretty){
  const raw = document.getElementById('input').value.trim();
  if(!raw){ setStatus('Please paste JSON first', 'text-amber-400'); return; }
  try{
    const obj = JSON.parse(raw);
    document.getElementById('output').value = pretty ? JSON.stringify(obj, null, 2) : JSON.stringify(obj);
    setStatus('✓ Valid JSON · ' + (pretty ? 'Formatted' : 'Minified'), 'text-emerald-400');
  }catch(e){
    setStatus('❌ Invalid JSON: ' + e.message, 'text-red-400');
    document.getElementById('output').value = '';
  }
}
function validate(){
  const raw = document.getElementById('input').value.trim();
  if(!raw){ setStatus('Please paste JSON first', 'text-amber-400'); return; }
  try{
    JSON.parse(raw);
    setStatus('✓ Valid JSON', 'text-emerald-400');
  }catch(e){
    setStatus('❌ Invalid JSON: ' + e.message, 'text-red-400');
  }
}
function clearAll(){
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  setStatus('', '');
}
function copyResult(){
  const t = document.getElementById('output').value;
  if(!t) return;
  navigator.clipboard.writeText(t).then(()=> setStatus('✓ Copied!', 'text-emerald-400'));
}
function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'text-xs mt-2 ' + cls;
}
</script>
</body>
</html>
